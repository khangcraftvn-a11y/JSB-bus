<head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/profile.css" />
    <link rel="icon" type="images/webp" href="img/limlogo.webp">
</head>

<body>
    <header id="header">
        <div class="container">
            <div class="logo">
                <img class="logo"
                    src="https://i0.wp.com/limbuscompany.global/wp-content/uploads/2021/10/limbus_logo_text_02-1.png?ssl=1"
                    alt="logo">
            </div>
            <div class="navigation">
                <div class="nav-left">
                    <a href="./main.html">TOP</a>
                    <a href="./main.html">WORLD</a>
                    <a href="./char.html">CHARACTER</a>
                    <a href="./game.html">GAMESYSTEM</a>
                    <a href="./story.html">STORY</a>
                    <a href="./dungeon.html">DUNGEON</a>
                    <a href="./chatRyoshu.html">CHAT</a>
                    <a href="./profile.html">PROFILE</a>
                </div>
                <div class="nav-right">
                    <a href="./index.html" id="auth-link">
                        <button style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"
                            id="login-btn">Login</button>
                    </a>
                </div>
            </div>
        </div>
        </div>
    </header>

    <div class="container">
        <div class="profile-wrapper">
            <h2 class="profile-title text-center">MANAGER IDENTIFICATION CARD</h2>

            <div class="row">
                <div
                    class="col-md-4 avatar-box d-flex flex-column align-items-center justify-content-center mb-4 mb-md-0">
                    <img id="profileAvatar" src="https://via.placeholder.com/170/222222/F1BF02?text=No+Identity"
                        alt="Sinner Portrait" class="avatar-frame">
                </div>

                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label limbus-label">Manager Name</label>
                        <input type="text" id="profileName" class="form-control limbus-input custom-readonly" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label limbus-label">Email Address</label>
                        <input type="email" id="profileEmail" class="form-control limbus-input custom-readonly"
                            readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label limbus-label">Security Password</label>
                        <input type="text" id="profilePasswordDisplay" class="form-control limbus-input custom-readonly"
                            readonly style="letter-spacing: 3px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label limbus-label">Sinner Image URL</label>
                        <input type="text" id="avatarUrl" class="form-control limbus-input"
                            placeholder="Click here to upload from your files...">

                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    </div>

                    <div class="text-end mt-4">
                        <a href="./main.html" class="btn btn-limbus-save text-decoration-none d-inline-block">RETURN TO
                            MAIN</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </form>
    </div>
    </div>

    <footer class="footer-section mt-5">
        <div class="footer-downloads">
            <a href="https://limbus-company.vi.softonic.com/" target="_blank"><img src="img/softonic.png"
                    alt="Google Play"></a>
            <a href="https://apps.apple.com/us/app/limbus-company/id6444112366" target="_blank"><img
                    src="img/AppStore.png" alt="App Store"></a>
            <a href="https://store.steampowered.com/app/1973530/Limbus_Company/" target="_blank"><img
                    src="img/steam1.webp" alt="Steam"></a>
        </div>
        <div class="footer-links">
            <a href="#">Terms of Service</a><span>|</span><a href="#">Privacy Policy</a>
        </div>
        <div class="footer-copy">
            <p>Copyright © 2021 — PROJECT MOON. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="./js/profile.js"></script>
</body>

</html>
